<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saving Favorites with localStorage</title>
  <link rel="stylesheet" href="homework.css">
  <script src="homework.js" defer></script>
</head>
<body>

<header class="hero">
  <div class="hero-content">
    <h1>Trail Finder</h1>
  </div>
</header>

<main class="container">

  <section class="trails-section">
    <div class="section-heading">
        <h2>Trail Options</h2>
      <span class="trail-count" id="trail-count">12 Trails</span>
    </div>

    <div id="trail-list" class="trail-grid">
    </div>
  </section>

  <section class="saved-section">
    <div class="section-heading">
      <div>
        <h2>Saved Trails</h2>
      </div>
      <span class="saved-count" id="saved-count">Saved: 0</span>
    </div>

    <div id="saved-list" class="trail-grid">
      <p class="empty-message">No saved trails yet.</p>
    </div>
  </section>

</main>

</body>
</html>
